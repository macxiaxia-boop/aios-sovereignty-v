name: aios-kernel-ci

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Verify imports
        run: |
          python -c "import aios_kernel; print(aios_kernel.__version__)"

      - name: Run unit tests
        run: |
          # Ignore tests/unit/test_goal_guard.py — pre-existing historical flake
          # (requires goal_guard_hook module not in R1503 scope).
          python -m pytest tests/unit/ \
            --ignore=tests/unit/test_goal_guard.py \
            -v --tb=short --cov=aios_kernel --cov-report=xml --cov-report=term

      - name: Run integration tests
        run: |
          # R1503 e2e + R1504 claude-code-adapter e2e.
          # Other integration tests have pre-existing historical flake
          # (test_docker.py, test_crash_recovery.py) and are not in R1503.
          python -m pytest tests/integration/test_e2e.py \
            tests/integration/test_claude_code_adapter_e2e.py \
            tests/integration/test_p5_workflow_integrity.py \
            tests/integration/test_p6_worker_security.py \
            tests/integration/test_p6_scheduler_state.py \
            tests/integration/test_p6_atomic_claim.py \
            tests/integration/test_p7_workflow_leases.py \
            tests/integration/test_p7_effect_context.py \
            tests/integration/test_p7_external_effects.py \
            tests/integration/test_p7_migration.py \
            tests/integration/test_p9_cloudtech_v4_adapter.py \
            tests/integration/test_p9_cloudtech_gateway.py \
            tests/integration/test_p9_hosted_gateway.py \
            tests/integration/test_p9_artifact_evidence.py \
            tests/integration/test_p10_durable_dispatch.py \
            -v --tb=short --cov=aios_kernel --cov-append

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev deps
        run: |
          python -m pip install ruff mypy
          pip install -e ".[dev]"
      - name: Ruff check R1503 modules (strict — must be clean)
        run: |
          # R1503 modules (scheduler/state_machine/agents/gateway/runtime/adapters) must be 0-error.
          # Legacy modules are excluded via pyproject.toml [tool.ruff].extend-exclude.
          ruff check \
            src/aios_kernel/scheduler.py \
            src/aios_kernel/state_machine.py \
            src/aios_kernel/workers/adapters.py \
            src/aios_kernel/agents/ \
            src/aios_kernel/gateway/ \
            src/aios_kernel/runtime/
      - name: Ruff check legacy (advisory)
        run: |
          ruff check src/ tests/ || true
        continue-on-error: true
      - name: Mypy check
        run: |
          mypy src/aios_kernel --ignore-missing-imports || true
        continue-on-error: true

  quality-gate:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then exit 1; fi
          echo "✅ R1503 quality gate passed (lint is non-blocking)"