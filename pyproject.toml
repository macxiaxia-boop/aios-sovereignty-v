[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-kernel"
version = "0.1.0"
description = "AIOS Kernel — VNext Phase A core runtime (wrap-not-rewrite)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AIOS Kernel Dev", email = "kernel@aios.local" }]
keywords = ["aios", "kernel", "vnext", "durable-execution"]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "temporalio>=1.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "coverage>=7.4",
]

[project.scripts]
aios-kernel = "aios_kernel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/aios_kernel"]

[tool.coverage.run]
source = ["aios_kernel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
