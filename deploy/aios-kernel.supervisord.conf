; R1504 production rollout: supervisord config for AIOS kernel + verifier
;
; Install: supervisord -c /etc/supervisor/conf.d/aios-kernel.supervisord.conf
; Or: copy to /etc/supervisor/conf.d/aios-kernel.conf + supervisorctl reread + update

[unix_http_server]
file=/var/run/aios-kernel-supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/aios-kernel/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/aios-kernel-supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/aios-kernel-supervisor.sock

[program:aios-kernel]
command=python -m aios_kernel.cli scheduler run
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/var/log/aios-kernel/kernel.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/aios-kernel/kernel.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
environment=AIOS_KERNEL_OFFLINE="1",PYTHONUNBUFFERED="1",AIOS_LOG_LEVEL="INFO"

[program:aios-verifier]
command=python -m aios_kernel.verifier.server
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=20
stopsignal=TERM
stdout_logfile=/var/log/aios-kernel/verifier.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/aios-kernel/verifier.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
environment=AIOS_KERNEL_OFFLINE="1",PYTHONUNBUFFERED="1"

[group:aios-kernel]
programs=aios-kernel,aios-verifier