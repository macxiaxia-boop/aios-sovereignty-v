version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aios_vnext
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: ${AIOS_DB_PASSWORD}
    volumes:
      - aios_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready
      interval: 10s
    networks: [airgap]

  kernel:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIOS_KERNEL_DATABASE_URL: postgresql+psycopg://aios:${AIOS_DB_PASSWORD}@postgres/aios_vnext
      AIOS_KERNEL_OFFLINE: "1"
    networks: [airgap]
    ports:
      - "9000:9000"

  verifier:
    build: .
    command: ["python", "-m", "aios_kernel.verifier.server"]
    networks: [airgap]
    depends_on: [postgres]

networks:
  airgap:
    driver: bridge
    internal: true  # NO external network

# NO services depend on external networks. Airgap enforced.
